name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify generated secrets stay out of logs
        run: node --test scripts/cluster-secret-output.test.mjs
      - name: Scan commits with Gitleaks
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner

  semgrep:
    name: Semgrep OWASP source scan (${{ matrix.scope }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: api
            targets: apps/api/src
          - scope: web
            targets: >-
              apps/web/src apps/web/next.config.ts
          - scope: worker
            targets: apps/worker/src
          - scope: api-client
            targets: packages/api-client/src
          - scope: tooling
            targets: packages/contracts/src packages/line-gate/src scripts
          - scope: load-harness
            targets: tests/load apps/api/prisma/load-fixture.ts apps/api/prisma/load-fixture
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan handwritten source
        run: >-
          docker run --rm
          -v "$PWD:/src"
          -w /src
          semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d
          semgrep scan --oss-only --error --jobs 4 --timeout 15 --timeout-threshold 5
          --max-memory 2048 --config p/typescript --config p/nodejs --config p/owasp-top-ten
          --metrics=off --exclude node_modules --exclude .next --exclude dist --exclude work
          --exclude '**/generated.ts' --exclude '**/generated/**'
          ${{ matrix.targets }}

  codeql:
    name: CodeQL security-extended
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze repository
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

  dependency-review:
    name: Dependency vulnerability gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Block vulnerable production dependencies
        run: pnpm audit --prod --audit-level=moderate
      - name: Block strong-copyleft production dependencies
        run: pnpm licenses:check
