name: plg-vps1-frontend-monitoring

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  # --------------------------------------------------------------------------
  # Ingress & Reverse Proxy (Caddy)
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in runtime.env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}
      VPS2_PRIVATE_IP: ${VPS2_PRIVATE_IP:?Set VPS2_PRIVATE_IP in runtime.env}
      POSTHOG_INGEST_HOST: ${POSTHOG_INGEST_HOST:-us.i.posthog.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    cpus: ${CADDY_CPUS:-0.5}
    logging: *default-logging
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:80/health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # Next.js 16 Production Frontend
  # --------------------------------------------------------------------------
  web:
    image: plg-web:${IMAGE_TAG:-local}
    build:
      context: ../../..
      dockerfile: deploy/Dockerfile.web
      args:
        API_ORIGIN: http://caddy
        API_INTERNAL_URL: http://caddy/api/v1
        NEXT_PUBLIC_REALTIME_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}
        NEXT_PUBLIC_OBSERVABILITY_ENVIRONMENT: ${NEXT_PUBLIC_OBSERVABILITY_ENVIRONMENT:-production}
        NEXT_PUBLIC_POSTHOG_ENABLED: ${NEXT_PUBLIC_POSTHOG_ENABLED:-false}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-/e}
    environment:
      API_ORIGIN: http://caddy
      API_INTERNAL_URL: http://caddy/api/v1
      NEXT_PUBLIC_REALTIME_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}
      NEXT_PUBLIC_OBSERVABILITY_ENVIRONMENT: ${NEXT_PUBLIC_OBSERVABILITY_ENVIRONMENT:-production}
      NEXT_PUBLIC_POSTHOG_ENABLED: ${NEXT_PUBLIC_POSTHOG_ENABLED:-false}
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-/e}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=65532,gid=65532,mode=1777
      - /app/apps/web/.next/cache:size=256m,uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    cpus: ${WEB_CPUS:-1.0}
    networks: [edge]
    logging: *default-logging
    healthcheck:
      test:
        [
          CMD,
          /nodejs/bin/node,
          -e,
          "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # Prometheus Monitoring Hub
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['9090:9090']
    networks: [edge, monitoring]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    user: 65534:65534
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ['9093:9093']
    networks: [monitoring]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-256m}
    cpus: ${ALERTMANAGER_CPUS:-0.25}
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in runtime.env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ['3300:3000']
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  # --------------------------------------------------------------------------
  # Loki Central Log Aggregator (Receives logs from VPS 1, VPS 2, and VPS 3)
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yml']
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      # Bound to private IP for log pushing from VPS 2 and VPS 3
      - '${VPS1_PRIVATE_IP}:3100:3100'
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    command: ['run', '/etc/alloy/config.alloy', '--storage.path=/var/lib/alloy/data']
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    pid: host
    security_opt: [no-new-privileges:true]

networks:
  edge:
  monitoring:

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
