groups:
  - name: plg-cluster
    rules:
      # ── Service Availability ──────────────────────────────────────────
      - alert: HostDown
        expr: up{job=~"vps1-node|vps2-node|vps3-node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Node exporter unreachable on {{ $labels.job }}'

      - alert: ApiDown
        expr: up{job="vps2-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Backend API is down on VPS 2'

      - alert: PostgresDown
        expr: up{job="vps3-postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'PostgreSQL is down on VPS 3'

      - alert: RedisDown
        expr: up{job="vps3-redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Redis is down on VPS 3'

      # ── Host Resource Alerts ──────────────────────────────────────────
      - alert: HostDiskNearlyFull
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Less than 15% disk space free on {{ $labels.instance }}'

      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Memory pressure on {{ $labels.instance }}'

      - alert: HighCpuUsage
        expr: |
          100 - (avg by(job)
            (rate(node_cpu_seconds_total{mode="idle",job=~"vps1-node|vps2-node|vps3-node"}[5m]))
          * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'CPU usage above 85% on {{ $labels.job }} for 10+ minutes'
          description: 'Current CPU usage: {{ $value | printf "%.1f" }}%'

      - alert: HighMemoryUsage
        expr: |
          (1 - node_memory_MemAvailable_bytes{job=~"vps1-node|vps2-node|vps3-node"}
          / node_memory_MemTotal_bytes{job=~"vps1-node|vps2-node|vps3-node"}) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Memory usage above 90% on {{ $labels.job }}'
          description: 'Current memory usage: {{ $value | printf "%.1f" }}%'

      - alert: HighDiskIO
        expr: |
          rate(node_disk_io_time_seconds_total{job=~"vps1-node|vps2-node|vps3-node"}[5m]) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Disk I/O utilization above 90% on {{ $labels.job }}'

      # ── Application Performance Alerts ────────────────────────────────
      - alert: ApiHighErrorRate
        expr: |
          (sum(rate(http_requests_total{job="vps2-api",status=~"5.."}[5m]))
          / sum(rate(http_requests_total{job="vps2-api"}[5m]))) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'API error rate above 5% (HTTP 5xx)'
          description: 'Current error rate: {{ $value | printf "%.1f" }}%'

      - alert: ApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by(le) (rate(http_request_duration_seconds_bucket{job="vps2-api"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'API P95 latency above 2 seconds'
          description: 'Current P95: {{ $value | printf "%.2f" }}s'

      # ── Database & Cache Alerts ───────────────────────────────────────
      - alert: PostgresConnectionsSaturated
        expr: |
          sum(pg_stat_activity_count{job="vps3-postgres"})
          / pg_settings_max_connections{job="vps3-postgres"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'PostgreSQL connections above 80% of max'

      - alert: PostgresLowCacheHit
        expr: |
          pg_stat_database_blks_hit{job="vps3-postgres",datname!=""}
          / (pg_stat_database_blks_hit{job="vps3-postgres",datname!=""}
          + pg_stat_database_blks_read{job="vps3-postgres",datname!=""}) < 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'PostgreSQL cache hit ratio below 95%'

      - alert: RedisHighMemory
        expr: |
          redis_memory_used_bytes{job="vps3-redis"}
          / redis_memory_max_bytes{job="vps3-redis"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Redis memory usage above 80% of max'

      # ── Container Health ──────────────────────────────────────────────
      - alert: ContainerRestarting
        expr: |
          increase(container_restart_count{}[15m]) > 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} restarted 3+ times in 15 minutes'
