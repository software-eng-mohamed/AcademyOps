name: plg-academy-single-vps

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

x-app-common: &app-common
  image: plg-backend:${IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: deploy/Dockerfile.backend
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ['/tmp:size=64m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 512
  ulimits: { nofile: { soft: 65535, hard: 65535 } }
  logging: *default-logging

x-worker-environment: &worker-environment
  NODE_ENV: production
  API_PORT: '3001'
  WEB_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in runtime.env}
  METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in runtime.env}
  ACTION_TOKEN_ENCRYPTION_KEY: ${ACTION_TOKEN_ENCRYPTION_KEY:?Set ACTION_TOKEN_ENCRYPTION_KEY in runtime.env}
  R2_ENDPOINT: ${R2_ENDPOINT:?Set R2_ENDPOINT in runtime.env}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in runtime.env}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in runtime.env}
  R2_BUCKET: ${R2_BUCKET:?Set R2_BUCKET in runtime.env}

x-api-environment: &api-environment
  <<: *worker-environment
  CLAMAV_MODE: clamd
  CLAMAV_HOST: clamav
  CLAMAV_PORT: '3310'
  CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-5000}
  TRUSTED_PROXY_IP: 172.30.240.2
  SESSION_PEPPER: ${SESSION_PEPPER:?Set SESSION_PEPPER in runtime.env}
  QR_HMAC_SECRET: ${QR_HMAC_SECRET:?Set QR_HMAC_SECRET in runtime.env}
  FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:?Set FILE_SIGNING_SECRET in runtime.env}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY in runtime.env}
  MFA_RECOVERY_PEPPER: ${MFA_RECOVERY_PEPPER:?Set MFA_RECOVERY_PEPPER in runtime.env}
  PASSWORD_RESET_PEPPER: ${PASSWORD_RESET_PEPPER:?Set PASSWORD_RESET_PEPPER in runtime.env}
  PHONE_OTP_PEPPER: ${PHONE_OTP_PEPPER:?Set PHONE_OTP_PEPPER in runtime.env}
  WHATSAPP_AUTH_ENCRYPTION_KEY: ${WHATSAPP_AUTH_ENCRYPTION_KEY:?Set WHATSAPP_AUTH_ENCRYPTION_KEY in runtime.env}
  OTP_CONNECTOR_INTERNAL_TOKEN: ${OTP_CONNECTOR_INTERNAL_TOKEN:?Set OTP_CONNECTOR_INTERNAL_TOKEN in runtime.env}

x-web-health: &web-health "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(!r.ok)).catch(()=>process.exit(1))"
x-api-health: &api-health "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(!r.ok)).catch(()=>process.exit(1))"

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in runtime.env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    user: 65532:65532
    read_only: true
    tmpfs: ['/tmp:size=16m,uid=65532,gid=65532,mode=1777']
    networks:
      app:
        ipv4_address: 172.30.240.2
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    cpus: ${CADDY_CPUS:-0.5}
    logging: *default-logging
    depends_on:
      web: { condition: service_healthy }
      api-a: { condition: service_healthy }
      api-b: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: plg-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
      args:
        API_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}
        API_INTERNAL_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}/api/v1
        NEXT_PUBLIC_REALTIME_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}
        NEXT_PUBLIC_OBSERVABILITY_ENVIRONMENT: ${NEXT_PUBLIC_OBSERVABILITY_ENVIRONMENT:-production}
    environment:
      API_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}
      API_INTERNAL_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}/api/v1
      NEXT_PUBLIC_REALTIME_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}
      NEXT_PUBLIC_OBSERVABILITY_ENVIRONMENT: ${NEXT_PUBLIC_OBSERVABILITY_ENVIRONMENT:-production}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=65532,gid=65532,mode=1777
      - /app/apps/web/.next/cache:size=256m,uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: ${WEB_MEM_LIMIT:-1g}
    cpus: ${WEB_CPUS:-1.0}
    networks: [app]
    logging: *default-logging
    healthcheck:
      test: [CMD, /nodejs/bin/node, -e, *web-health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-a: &api
    <<: *app-common
    environment:
      <<: *api-environment
      SERVICE_ROLE: api
      DATABASE_URL: ${API_DATABASE_URL:?Set API_DATABASE_URL in runtime.env}
      LEGACY_ARCHIVE_KEY: ${LEGACY_ARCHIVE_KEY:?Set LEGACY_ARCHIVE_KEY in runtime.env}
      PAYMOB_BASE_URL: https://accept.paymob.com
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:?Set PAYMOB_SECRET_KEY in runtime.env}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:?Set PAYMOB_PUBLIC_KEY in runtime.env}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:?Set PAYMOB_HMAC_SECRET in runtime.env}
      PAYMOB_PAYMENT_METHOD_IDS: ${PAYMOB_PAYMENT_METHOD_IDS:?Set PAYMOB_PAYMENT_METHOD_IDS in runtime.env}
      PAYMOB_NOTIFICATION_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}/api/v1/webhooks/paymob/transaction
      PAYMOB_REDIRECTION_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in runtime.env}/ar/payments/paymob/return
      PAYMOB_CHECKOUT_ENCRYPTION_KEY: ${PAYMOB_CHECKOUT_ENCRYPTION_KEY:?Set PAYMOB_CHECKOUT_ENCRYPTION_KEY in runtime.env}
    command: ['api/dist/main.js']
    mem_limit: ${API_MEM_LIMIT:-1536m}
    cpus: ${API_CPUS:-1.5}
    networks: [app, data, monitoring, otp-connector]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test: [CMD, /nodejs/bin/node, -e, *api-health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-b:
    <<: *api

  worker:
    <<: *app-common
    environment:
      <<: *worker-environment
      SERVICE_ROLE: worker
      DATABASE_URL: ${WORKER_DATABASE_URL:?Set WORKER_DATABASE_URL in runtime.env}
      OTP_CONNECTOR_INTERNAL_TOKEN: ${OTP_CONNECTOR_INTERNAL_TOKEN:?Set OTP_CONNECTOR_INTERNAL_TOKEN in runtime.env}
      OTP_CONNECTOR_URL: http://otp-connector:3002
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in runtime.env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME:-}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in runtime.env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in runtime.env}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL in runtime.env}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AcademyOps}
      SMTP_RETURN_PATH: ${SMTP_RETURN_PATH:?Set SMTP_RETURN_PATH in runtime.env}
    command: ['worker/dist/main.js']
    mem_limit: ${WORKER_MEM_LIMIT:-1g}
    cpus: ${WORKER_CPUS:-1.0}
    networks: [data, egress, monitoring, otp-connector]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      otp-connector: { condition: service_healthy }

  otp-connector:
    image: plg-otp-connector:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.otp-connector
    restart: unless-stopped
    init: true
    user: pptruser
    read_only: true
    shm_size: 512m
    tmpfs:
      - /tmp:size=512m,uid=10042,gid=10042,mode=0700
    volumes:
      - otp-connector-session:/sessions
    environment:
      NODE_ENV: production
      OTP_CONNECTOR_INTERNAL_TOKEN: ${OTP_CONNECTOR_INTERNAL_TOKEN:?Set OTP_CONNECTOR_INTERNAL_TOKEN in runtime.env}
      OTP_CONNECTOR_API_URLS: http://api-a:3001,http://api-b:3001
      OTP_CONNECTOR_PORT: '3002'
      OTP_CONNECTOR_CHROME_PATH: /usr/bin/google-chrome-stable
      OTP_CONNECTOR_SESSION_PATH: /sessions
      OTP_CONNECTOR_MAX_SESSIONS: '5'
    networks: [otp-connector, egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    ulimits: { nofile: { soft: 8192, hard: 8192 } }
    mem_limit: ${OTP_CONNECTOR_MEM_LIMIT:-2g}
    cpus: ${OTP_CONNECTOR_CPUS:-1.5}
    logging: *default-logging
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(!r.ok)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  clamav:
    image: clamav/clamav:1.4.3-3_base@sha256:d8cf01b35b0e504c55e4e84b80bce4fc68ce61d76378e906478d1052ceca1e9c
    restart: unless-stopped
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks: [data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${CLAMAV_MEM_LIMIT:-4g}
    cpus: ${CLAMAV_CPUS:-1.0}
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', '/clamdcheck.sh']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in runtime.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in runtime.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in runtime.env}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=300
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    shm_size: 512m
    mem_limit: ${POSTGRES_MEM_LIMIT:-3g}
    cpus: ${POSTGRES_CPUS:-2.0}
    pids_limit: 512
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in runtime.env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-768mb}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD" --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy noeviction --tcp-keepalive 60 --timeout 0
    volumes:
      - redis-data:/data
    networks: [data]
    mem_limit: ${REDIS_MEM_LIMIT:-1g}
    cpus: ${REDIS_CPUS:-0.75}
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  db-observability-init:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in runtime.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in runtime.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in runtime.env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in runtime.env}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD:?Set POSTGRES_MIGRATE_PASSWORD in runtime.env}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?Set POSTGRES_EXPORTER_PASSWORD in runtime.env}
    entrypoint: [/bin/sh, /opt/plg/init-observability.sh]
    volumes:
      - ./postgres/init-observability.sh:/opt/plg/init-observability.sh:ro
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    security_opt: [no-new-privileges:true]

  migrate:
    image: plg-backend:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.backend
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: ${DIRECT_URL:?Set DIRECT_URL in runtime.env}
      DIRECT_URL: ${DIRECT_URL:?Set DIRECT_URL in runtime.env}
    entrypoint: [/nodejs/bin/node]
    command:
      [api/node_modules/prisma/build/index.js, migrate, deploy, --schema=api/prisma/schema.prisma]
    networks: [data]
    depends_on:
      db-observability-init: { condition: service_completed_successfully }

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    restart: unless-stopped
    user: 65534:65534
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ['127.0.0.1:9093:9093']
    networks: [monitoring, egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-256m}
    cpus: ${ALERTMANAGER_CPUS:-0.25}
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in runtime.env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:3300:3000']
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yml']
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    restart: unless-stopped
    command: ['run', '/etc/alloy/config.alloy', '--storage.path=/var/lib/alloy/data']
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data
    networks: [monitoring]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    pid: host
    security_opt: [no-new-privileges:true]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?Set POSTGRES_EXPORTER_DSN in runtime.env}
    networks: [data, monitoring]
    depends_on:
      db-observability-init: { condition: service_completed_successfully }
    security_opt: [no-new-privileges:true]

networks:
  app: { ipam: { config: [{ subnet: 172.30.240.0/24 }] } }
  egress:
  data:
    internal: true
  monitoring:
    internal: true
  otp-connector:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  clamav-signatures:
  otp-connector-session:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
