global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'api'
    metrics_path: '/api/v1/internal/metrics'
    authorization:
      type: Bearer
      credentials: '${METRICS_TOKEN}'
    static_configs:
      - targets: ['api-a:3001', 'api-b:3001']

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:9464']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:8080']
