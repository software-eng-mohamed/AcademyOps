global:
  resolve_timeout: 5m

route:
  receiver: external-webhook
  group_by: [alertname, severity]
  group_wait: 5s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: external-webhook
    webhook_configs:
      - url: '__ALERT_WEBHOOK_URL__'
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, instance]
