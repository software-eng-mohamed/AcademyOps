global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: api
    metrics_path: /api/v1/internal/metrics
    authorization:
      type: Bearer
      credentials: __METRICS_TOKEN__
    static_configs:
      - targets: [api-a:3001, api-b:3001]

  - job_name: worker
    metrics_path: /metrics
    scrape_timeout: 3s
    authorization:
      type: Bearer
      credentials: __METRICS_TOKEN__
    static_configs:
      - targets: [worker:9464]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api-a:3001/api/v1/health/ready
          - http://api-b:3001/api/v1/health/ready
          - http://web:3100/ar/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
